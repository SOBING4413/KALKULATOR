<!DOCTYPE html>
<html lang="id" data-theme="lake">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hallo Bubub 💕</title>
    <meta name="description" content="Kalkulator cantik buatan Sobing untuk Bubub tersayang">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- Background Image with Parallax (desktop only) -->
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-overlay"></div>

    <!-- Lightning Flash (desktop only) -->
    <div class="lightning-flash" id="lightningFlash"></div>

    <!-- Rain Effect Canvas (desktop only) -->
    <canvas id="rainCanvas" class="rain-canvas"></canvas>

    <!-- Animated Particles (desktop only) -->
    <canvas id="particleCanvas" class="particle-canvas"></canvas>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <!-- Floating Mist (desktop only) -->
    <div class="mist-container">
        <div class="mist mist-1"></div>
        <div class="mist mist-2"></div>
        <div class="mist mist-3"></div>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-switcher" id="themeSwitcher">
        <button class="theme-btn active" data-theme="lake" title="🌧️ Kota Hujan">
            <span class="theme-dot" style="background: linear-gradient(135deg, #4ade80, #22d3ee);"></span>
        </button>
        <button class="theme-btn" data-theme="forest" title="🌲 Hutan Berkabut">
            <span class="theme-dot" style="background: linear-gradient(35deg, #6a3d4a, #a3e635);"></span>
        </button>
        <button class="theme-btn" data-theme="mountain" title="🏔️ Gunung & Danau">
            <span class="theme-dot" style="background: linear-gradient(15deg, #ea5e9f, #8b5cf6);"></span>
        </button>
        <button class="theme-btn" data-theme="zen" title="🎋 Taman Zen">
            <span class="theme-dot" style="background: linear-gradient(135deg, #f472b6, #fb923c);"></span>
        </button>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Info Widget -->
        <div class="info-widget" id="infoWidget">
            <div class="info-widget-inner">
                <!-- Clock Section -->
                <div class="widget-clock-section">
                    <div class="widget-time" id="widgetTime">--:--:--</div>
                    <div class="widget-date" id="widgetDate">Loading...</div>
                    <div class="widget-timezone" id="widgetTimezone">
                        <span class="tz-badge" id="tzBadge">--</span>
                    </div>
                </div>
                <!-- Divider -->
                <div class="widget-divider"></div>
                <!-- Location & Weather -->
                <div class="widget-info-section">
                    <div class="widget-location" id="widgetLocation">
                        <svg class="widget-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                        <span id="locationText">Mendeteksi lokasi...</span>
                    </div>
                    <div class="widget-weather" id="widgetWeather">
                        <div class="weather-temp-wrapper">
                            <span class="weather-emoji" id="weatherEmoji">🌡️</span>
                            <span class="weather-temp" id="weatherTemp">--°C</span>
                        </div>
                        <span class="weather-desc" id="weatherDesc">Memuat cuaca...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Calculator -->
        <div class="calculator" id="calculator">
            <!-- Glow border -->
            <div class="neon-border"></div>

            <!-- Header -->
            <div class="calc-header">
                <div class="calc-logo">
                    <div class="logo-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="2" width="20" height="20" rx="4" stroke="currentColor" stroke-width="1.5"/>
                            <line x1="7" y1="7" x2="17" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <circle cx="7.5" cy="12" r="1" fill="currentColor"/>
                            <circle cx="12" cy="12" r="1" fill="currentColor"/>
                            <circle cx="16.5" cy="12" r="1" fill="currentColor"/>
                            <circle cx="7.5" cy="16.5" r="1" fill="currentColor"/>
                            <circle cx="12" cy="16.5" r="1" fill="currentColor"/>
                            <circle cx="16.5" cy="16.5" r="1" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="gradient-text">Hallo Bubub</span>
                </div>
                <div class="calc-actions">
                    <button class="action-btn" id="converterToggle" title="Konversi Satuan">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"/>
                            <path d="M3 11V9a4 4 0 014-4h14"/>
                            <polyline points="7 23 3 19 7 15"/>
                            <path d="M21 13v2a4 4 0 01-4 4H3"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="stopwatchToggle" title="Stopwatch">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="13" r="8"/>
                            <path d="M12 9v4l2 2"/>
                            <path d="M5 3L2 6"/>
                            <path d="M22 6l-3-3"/>
                            <path d="M12 2v2"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="notesToggle" title="Catatan Cepat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="sciToggle" title="Mode Ilmiah">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4.5 12a7.5 7.5 0 0015 0m-15 0a7.5 7.5 0 0115 0m-15 0H3m16.5 0H21m-9-9v.01M12 21v-.01M7.5 4.2l.01.01M16.5 19.8l.01.01M4.2 7.5l.01.01M19.8 16.5l.01.01M4.2 16.5l.01.01M19.8 7.5l.01.01"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="historyToggle" title="Riwayat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Display -->
            <div class="calc-display" id="calcDisplay">
                <div class="display-expression" id="expression"></div>
                <div class="display-result-wrapper">
                    <div class="display-result" id="result">0</div>
                    <button class="copy-btn" id="copyBtn" title="Salin hasil">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                        </svg>
                    </button>
                </div>
                <div class="copy-toast" id="copyToast">Disalin! ✓</div>
            </div>

            <!-- Unit Converter Panel -->
            <div class="converter-panel" id="converterPanel">
                <div class="converter-tabs">
                    <button class="conv-tab active" data-conv="length">📏 Panjang</button>
                    <button class="conv-tab" data-conv="weight">⚖️ Berat</button>
                    <button class="conv-tab" data-conv="temp">🌡️ Suhu</button>
                </div>
                <div class="converter-body">
                    <div class="conv-row">
                        <input type="number" class="conv-input" id="convFrom" placeholder="Masukkan nilai..." step="any">
                        <select class="conv-select" id="convFromUnit"></select>
                    </div>
                    <div class="conv-swap-row">
                        <button class="conv-swap-btn" id="convSwap" title="Tukar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="7 16 3 12 7 8"/>
                                <polyline points="17 8 21 12 17 16"/>
                                <line x1="3" y1="12" x2="21" y2="12"/>
                            </svg>
                        </button>
                    </div>
                    <div class="conv-row">
                        <input type="text" class="conv-input conv-result-input" id="convTo" readonly placeholder="Hasil...">
                        <select class="conv-select" id="convToUnit"></select>
                    </div>
                </div>
            </div>

            <!-- Stopwatch Panel -->
            <div class="stopwatch-panel" id="stopwatchPanel">
                <div class="stopwatch-display" id="stopwatchDisplay">00:00.00</div>
                <div class="stopwatch-controls">
                    <button class="sw-btn sw-start" id="swStart">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <span>Mulai</span>
                    </button>
                    <button class="sw-btn sw-stop" id="swStop" style="display:none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        <span>Pause</span>
                    </button>
                    <button class="sw-btn sw-lap" id="swLap" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
                        <span>Lap</span>
                    </button>
                    <button class="sw-btn sw-reset" id="swReset" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                        <span>Reset</span>
                    </button>
                </div>
                <div class="stopwatch-laps" id="swLaps"></div>
            </div>

            <!-- Notes Panel -->
            <div class="notes-panel" id="notesPanel">
                <div class="notes-header-row">
                    <span class="notes-title">📝 Catatan Cepat</span>
                    <button class="notes-add-btn" id="notesAddBtn" title="Tambah Catatan">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
                <div class="notes-input-area" id="notesInputArea" style="display:none;">
                    <textarea class="notes-textarea" id="notesTextarea" placeholder="Tulis catatan..." rows="3"></textarea>
                    <div class="notes-input-actions">
                        <button class="notes-save-btn" id="notesSaveBtn">Simpan</button>
                        <button class="notes-cancel-btn" id="notesCancelBtn">Batal</button>
                    </div>
                </div>
                <div class="notes-list" id="notesList">
                    <div class="notes-empty">Belum ada catatan</div>
                </div>
            </div>

            <!-- Scientific Panel -->
            <div class="scientific-panel" id="scientificPanel">
                <div class="sci-grid">
                    <button class="btn btn-sci" data-action="sin">sin</button>
                    <button class="btn btn-sci" data-action="cos">cos</button>
                    <button class="btn btn-sci" data-action="tan">tan</button>
                    <button class="btn btn-sci" data-action="log">log</button>
                    <button class="btn btn-sci" data-action="ln">ln</button>
                    <button class="btn btn-sci" data-action="sqrt">√</button>
                    <button class="btn btn-sci" data-action="pow">x²</button>
                    <button class="btn btn-sci" data-action="cube">x³</button>
                    <button class="btn btn-sci" data-action="factorial">x!</button>
                    <button class="btn btn-sci" data-action="pi">π</button>
                    <button class="btn btn-sci" data-action="e">e</button>
                    <button class="btn btn-sci" data-action="abs">|x|</button>
                    <button class="btn btn-sci" data-action="inv">1/x</button>
                    <button class="btn btn-sci" data-action="exp">EXP</button>
                    <button class="btn btn-sci" data-action="mod">mod</button>
                    <button class="btn btn-sci" data-action="paren-open">(</button>
                    <button class="btn btn-sci" data-action="paren-close">)</button>
                    <button class="btn btn-sci" data-action="pow-y">xʸ</button>
                </div>
            </div>

            <!-- Button Grid -->
            <div class="calc-buttons">
                <button class="btn btn-func" data-action="clear">AC</button>
                <button class="btn btn-func" data-action="backspace">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/>
                        <line x1="18" y1="9" x2="12" y2="15"/>
                        <line x1="12" y1="9" x2="18" y2="15"/>
                    </svg>
                </button>
                <button class="btn btn-func" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="divide">÷</button>

                <button class="btn btn-number" data-action="7">7</button>
                <button class="btn btn-number" data-action="8">8</button>
                <button class="btn btn-number" data-action="9">9</button>
                <button class="btn btn-operator" data-action="multiply">×</button>

                <button class="btn btn-number" data-action="4">4</button>
                <button class="btn btn-number" data-action="5">5</button>
                <button class="btn btn-number" data-action="6">6</button>
                <button class="btn btn-operator" data-action="subtract">−</button>

                <button class="btn btn-number" data-action="1">1</button>
                <button class="btn btn-number" data-action="2">2</button>
                <button class="btn btn-number" data-action="3">3</button>
                <button class="btn btn-operator" data-action="add">+</button>

                <button class="btn btn-number btn-zero" data-action="0">0</button>
                <button class="btn btn-number" data-action="decimal">.</button>
                <button class="btn btn-equal" data-action="equals">=</button>
            </div>

            <!-- Paste hint -->
            <div class="paste-hint">
                <span>Ctrl+V untuk paste • Ctrl+C untuk copy</span>
            </div>
        </div>

        <!-- History Panel -->
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <h3>📜 Riwayat</h3>
                <button class="action-btn" id="clearHistory" title="Hapus Riwayat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                </button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <p>Belum ada riwayat</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Music Player -->
    <div class="music-player" id="musicPlayer">
        <button class="music-toggle" id="musicToggle" title="Music Player">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
            <div class="mini-visualizer" id="miniVisualizer">
             <span></span><span></span><span></span><span></span>
            </div>
        </button>

        <div class="music-panel" id="musicPanel">
            <div class="music-panel-header">
                <div class="music-title-row">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                    <span class="gradient-text">Music Player</span>
                </div>
                <button class="music-close" id="musicClose">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <!-- Audio Visualizer -->
            <div class="audio-visualizer" id="audioVisualizer">
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div>
            </div>

            <!-- YouTube Player Container -->
            <div id="ytPlayerContainer" class="yt-player-container">
                <div id="ytPlayer"></div>
            </div>

            <!-- Now Playing -->
            <div class="now-playing" id="nowPlaying">
                <span class="now-playing-text">Pilih genre atau paste link YouTube</span>
            </div>

            <!-- Preset Stations - 4 Genres: Lofi, Emo, K-Pop, Trap -->
            <div class="station-list">
                <button class="station-btn" data-video="jfKfPfyJRdk" data-name="🎵 Lofi Girl - beats to relax/study to">
                    <span class="station-icon">🎵</span>
                    <span class="station-name">Lofi</span>
                </button>
                <button class="station-btn" data-video="gFMb1FsvPMI" data-name="🖤 Emo Rock - My Chemical Romance Mix">
                    <span class="station-icon">🖤</span>
                    <span class="station-name">Emo</span>
                </button>
                <button class="station-btn" data-video="gQlMMD8auMs" data-name="💜 K-Pop Playlist - BTS, BLACKPINK, etc">
                    <span class="station-icon">💜</span>
                    <span class="station-name">K-Pop</span>
                </button>
                <button class="station-btn" data-video="n1WpP7iowLc" data-name="🔥 Trap Music - Hard Trap & Bass Beats">
                    <span class="station-icon">🔥</span>
                    <span class="station-name">Trap</span>
                </button>
            </div>

            <!-- Custom YouTube URL -->
            <div class="custom-url-section">
                <div class="url-input-wrapper">
                    <input type="text" class="url-input" id="youtubeUrl" placeholder="Paste YouTube URL di sini..." spellcheck="false">
                    <button class="url-play-btn" id="urlPlayBtn" title="Play">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Controls -->
            <div class="music-controls">
                <button class="ctrl-btn" id="musicPlayPause" title="Play/Pause">
                    <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                </button>
                <div class="volume-control">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
                </div>
            </div>
        </div>
    </div>

    <!-- Keyboard hint -->
    <div class="keyboard-hint" id="keyboardHint">
        <span>⌨️ Keyboard aktif</span>
    </div>

    <!-- Footer Credit -->
    <div class="footer-credit">
        <span>Made with ❤️ by <span class="gradient-text">Sobing</span></span>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="./script.js"></script>
</body>

</html>
